# Koyeb declarative deployment config.
# Deploys the backend on the free instance (512MB RAM, 0.1 vCPU, scale-to-zero).
# Either: push to main (auto-deploy via .github/workflows/deploy-koyeb.yml)
# or create the app manually in the dashboard and paste this file.
#
# Note: the free instance sleeps after 1 hour without traffic and has no
# persistent disk, so in-memory jobs/uploads are lost on sleep/restart.

name: ml-uv-unwrap
services:
  - name: web
    instance_types:
      - type: free
    scalings:
      - min: 0
        max: 1
    env:
      - key: PORT
        value: "8080"
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
        port: 8080
    git:
      repository: lovepunj/ml-uv-unwrap
      branch: main
      dockerfile:
        dockerfile: Dockerfile
    health_checks:
      - grace_period: 120
        interval: 30
        restart_limit: 3
        timeout: 10
        http:
          path: /api/health
          port: 8080
