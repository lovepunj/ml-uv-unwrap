[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-uv-unwrap"
version = "0.1.0"
description = "ML-trained UV unwrapping tool for 3D meshes"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "trimesh>=4.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    "xatlas>=0.0.9",
    "einops>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
mluvunwrap = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
